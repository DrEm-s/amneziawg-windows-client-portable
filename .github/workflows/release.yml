name: Build portable release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-portable.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source and portable dependency
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package portable archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $architectures = @("amd64", "x86", "arm64")
          foreach ($arch in $architectures) {
              $source = Join-Path $PWD $arch
              $stage = Join-Path $PWD "dist\amneziawg-windows-portable-$arch"
              if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $stage | Out-Null
              foreach ($file in @("amneziawg.exe", "awg.exe", "wintun.dll")) {
                  $path = Join-Path $source $file
                  if (-not (Test-Path $path)) { throw "Expected build artifact not found: $path" }
                  Copy-Item $path $stage
              }
              Copy-Item "PORTABLE.txt" $stage
              Copy-Item "COPYING" $stage
              $zip = Join-Path $PWD "dist\amneziawg-windows-portable-$arch.zip"
              if (Test-Path $zip) { Remove-Item $zip -Force }
              Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          }
          $sumFile = Join-Path $PWD "dist\SHA256SUMS.txt"
          if (Test-Path $sumFile) { Remove-Item $sumFile -Force }
          Get-ChildItem "dist\*.zip" | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)" | Out-File -FilePath $sumFile -Append -Encoding ascii
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-windows-portable-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
